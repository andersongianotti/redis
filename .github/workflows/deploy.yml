name: Build and Deploy to OpenShift

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      OC_SERVER: https://api.rm1.0a51.p1.openshiftapps.com:6443
      OC_NAMESPACE: anderson-gianotti-dev
      REGISTRY: default-route-openshift-image-registry.apps.rm1.0a51.p1.openshiftapps.com
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn -B deploy -DskipTests

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Trivy vulnerability report
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: 'fs'
          version: 'v0.76.1'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          format: 'table'
          exit-code: '0'

      - name: Trivy security gate (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: 'fs'
          version: 'v0.76.1'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'

      - name: Log in to OpenShift registry
        env:
          OC_TOKEN: ${{ secrets.OC_TOKEN }}
        run: |
          echo "Token length: ${#OC_TOKEN}"
          echo "Token prefix: ${OC_TOKEN:0:10}..."
          echo "$OC_TOKEN" | docker login "$REGISTRY" \
            -u "user" --password-stdin

      - name: Build and push image
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE="$REGISTRY/$OC_NAMESPACE/cache-mongo-redis:$SHORT_SHA"
          docker buildx build \
            --provenance=false --sbom=false \
            --load -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Install oc CLI
        run: |
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz \
            | tar xz oc
          sudo mv oc /usr/local/bin/

      - name: Deploy to OpenShift
        env:
          OC_TOKEN: ${{ secrets.OC_TOKEN }}
        run: |
          oc login --token="$OC_TOKEN" --server="$OC_SERVER"
          oc project "$OC_NAMESPACE"
          sed -i "s|cache-mongo-redis:latest|cache-mongo-redis:${GITHUB_SHA:0:7}|" openshift/app.yaml
          oc apply -f openshift/redis.yaml
          oc apply -f openshift/app.yaml
          oc rollout status deployment/cache-mongo-redis --timeout=10m

      - name: Show route
        run: oc get route cache-mongo-redis
