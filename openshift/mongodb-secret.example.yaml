# Crie o secret real com o connection string do Atlas:
#
#   oc create secret generic mongodb-atlas-uri \
#     --from-literal=uri="mongodb+srv://<user>:<password>@<cluster>.mongodb.net/userdb?retryWrites=true&w=majority" \
#     -n anderson-gianotti-dev
#
# Ou aplique este arquivo substituindo <URI_COMPLETA> pela string de conexao.
# ATENCAO: o URI contem credenciais - nao comite a versao real no git.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-atlas-uri
  labels:
    app: cache-mongo-redis
type: Opaque
stringData:
  uri: "<URI_COMPLETA>"
